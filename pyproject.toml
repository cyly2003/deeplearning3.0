[project]
name = "ecotox-qsar-transfer"
version = "0.1.0"
description = "ECOTOX QSAR transfer learning workflow"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "PySide6>=6.7",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.9"]
ml = ["torch>=2.2", "shap>=0.52"]
baseline = ["xgboost>=2.0", "lightgbm>=4.0"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "openpyxl>=3.1"]
padel = ["padelpy>=0.1.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qsar_tl*"]
